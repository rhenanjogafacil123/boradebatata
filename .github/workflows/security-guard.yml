name: Security guard

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: security-guard-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # pinned v5
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Scan tracked files for high-risk secrets
        run: node scripts/security-check.mjs
