name: One-time dependency repair

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/fix-dependencies-once.yml"

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: true
          fetch-depth: 1

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      - name: Install current lockfile
        run: bun install --frozen-lockfile

      - name: Apply available security fixes
        run: bun audit fix

      - name: Validate fixed dependency tree
        run: |
          bun install --frozen-lockfile
          bun audit --audit-level=high
          bun run build

      - name: Commit repaired lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bun.lock package.json
          if git diff --cached --quiet; then
            echo "No dependency changes were necessary."
          else
            git commit -m "Fix audited dependency vulnerabilities"
            git push
          fi
