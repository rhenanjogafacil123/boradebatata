name: Check Vercel Public Deployment

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify Bora de Batata production
        run: |
          set -euo pipefail
          BASE="https://boradebatata.vercel.app"
          for PATHNAME in "/" "/painel"; do
            URL="$BASE$PATHNAME"
            echo "Checking $URL"
            HTTP="$(curl -L --retry 4 --retry-delay 3 --connect-timeout 10 -sS -o /tmp/page.html -w '%{http_code}' "$URL")"
            test "$HTTP" = "200"
            grep -Eqi 'Bora de Batata|Painéis|Cardápio' /tmp/page.html
          done
          echo "Public deployment is healthy."
